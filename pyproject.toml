[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "election-prediction"
version = "0.0.1"
description = "Nonpartisan, reproducible, calibration-first US election analytics platform (Phase 0 / P0 foundation)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD — public license selected before first public artifact (PROJECT_CONTEXT.md)" }
authors = [{ name = "Savepoint Analytics" }]

# Kept intentionally boring and self-hostable (CLAUDE.md §3, §7).
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
model = ["statsmodels>=0.14", "scikit-learn>=1.3"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
# Reproducible one-command builds.
ep-build-p0 = "election_prediction.pipelines_cli:main"   # data-and-entity foundation
ep-build-p1 = "election_prediction.build_p1:main"        # baseline forecasting stack

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
