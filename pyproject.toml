[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "election-prediction"
version = "0.0.1"
description = "Nonpartisan, reproducible, calibration-first US election analytics platform (Phase 0 / P0 foundation)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD — public license selected before first public artifact (PROJECT_CONTEXT.md)" }
authors = [{ name = "Savepoint Analytics" }]

# Kept intentionally boring and self-hostable (CLAUDE.md §3, §7).
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
model = ["statsmodels>=0.14", "scikit-learn>=1.3"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]
# Figures for public writing only; no modelling code imports these (CLAUDE.md §7).
# matplotlib: PSF-style BSD-compatible licence (matplotlib/LICENSE).
viz = ["matplotlib>=3.8"]

[project.scripts]
# Reproducible one-command builds.
ep-build-p0 = "election_prediction.pipelines_cli:main"   # data-and-entity foundation
ep-build-p1 = "election_prediction.build_p1:main"        # baseline forecasting stack
ep-build-p2 = "election_prediction.build_p2:main"        # polling + correlated simulation
ep-build-governor = "election_prediction.build_governor:main"  # gubernatorial returns + coattails
ep-build-fec = "election_prediction.build_fec:main"        # candidate crosswalk, filings, fundraising
ep-build-cd-baselines = "election_prediction.build_cd_baselines:main"  # presidential vote by congressional district
ep-build-plan-transfer = "election_prediction.build_plan_transfer:main"  # old-to-new vote transfer (RD-003)
ep-fit-basis-map = "election_prediction.fit_basis_map:main"  # presidential -> House basis conversion

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Figure captions are prose that must match the rendered chart text verbatim
# (period, unit, source, snapshot date — CLAUDE.md §6). Wrapping them to the
# code line length splits sentences across literals and invites silent edits.
"blog/figures/*.py" = ["E501"]
